# Activate with --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev).
# Verbose HTTP/body logging - includes full request/response bodies, which for
# this app means real transaction descriptions and amounts sent to the LLM.
# Local development only; never enable this in a hosted/production environment.
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=TRACE
