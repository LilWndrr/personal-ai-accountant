spring.application.name=spring-ai-test

# OpenRouter Build (OpenAI-compatible API) - Used for EVERYTHING
spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1


spring.ai.openai.chat.model=meta/llama-3.2-11b-vision-instruct
spring.ai.openai.timeout=600s


app.categorization.model=nvidia/nemotron-3.5-lightning-30b-a3b

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.database=postgresql
spring.jpa.show-sql=true

spring.datasource.url= ${DATABASE_URL}
spring.datasource.username=${DATABASE_NAME}
spring.datasource.password=${DATABASE_PASSWORD}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Verbose HTTP/body logging (which includes real transaction data sent to the LLM)
# only turns on under the 'dev' profile - see application-dev.properties.
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web=INFO

# Persist logs to a rotating file alongside the console, so history survives
# restarts/redeploys instead of only living in whatever captured stdout.
logging.file.name=logs/spring-ai-test.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB