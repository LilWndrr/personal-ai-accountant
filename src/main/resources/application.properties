spring.application.name=spring-ai-test

# OpenRouter Build (OpenAI-compatible API) - Used for EVERYTHING
spring.ai.openai.api-key=${OPEN_ROUTER_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1

# Use Gemini 2.0 Flash for Vision/PDFs
spring.ai.openai.chat.model=qwen/qwen3.8-27b:free
spring.ai.openai.timeout=600s

# Use Gemini 2.0 Flash for Categorization
app.categorization.model=qwen/qwen3.8-27b:free


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.database=postgresql
spring.jpa.show-sql=true

spring.datasource.url= jdbc:postgresql://localhost:5432/ai_accountant
spring.datasource.username=postgres
spring.datasource.password=***REMOVED***

telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# Enable debug logging to see HTTP requests to NVIDIA API
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=TRACE