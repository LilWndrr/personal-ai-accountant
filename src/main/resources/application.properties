spring.application.name=spring-ai-test

# AI provider - any OpenAI-compatible API (OpenRouter, OpenAI, Groq, DeepSeek,
# Together, Mistral, Ollama, Gemini's OpenAI endpoint, ...). Switch provider by
# changing AI_BASE_URL + AI_API_KEY; switch models via the AI_*_MODEL vars.
# OPEN_ROUTER_KEY is still honoured as a fallback for existing setups.
spring.ai.openai.api-key=${AI_API_KEY:${OPEN_ROUTER_KEY:}}
spring.ai.openai.base-url=${AI_BASE_URL:https://openrouter.ai/api/v1}

# Vision model used to read statement pages (must accept image input).
spring.ai.openai.chat.model=${AI_CHAT_MODEL:minimax/minimax-m3.1-flash:free}
spring.ai.openai.timeout=${AI_TIMEOUT:600s}

# Model used to categorize transactions; defaults to the chat model.
app.categorization.model=${AI_CATEGORIZATION_MODEL:${spring.ai.openai.chat.model}}

# Sent as reasoning_effort on every LLM call. Leave AI_REASONING_EFFORT empty
# for providers/models that reject the parameter.
app.ai.reasoning-effort=${AI_REASONING_EFFORT:low}

# Client-side cap on LLM requests per minute, shared by all call sites. Set it
# just under your provider/plan limit (OpenRouter free tier is 20/min).
app.ai.rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:18}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.database=postgresql

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Prints every SQL statement; set SHOW_SQL=true only while debugging queries.
spring.jpa.show-sql=${SHOW_SQL:false}


spring.datasource.url= ${DATABASE_URL}
spring.datasource.username=${DATABASE_NAME}
spring.datasource.password=${DATABASE_PASSWORD}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Verbose HTTP/body logging (which includes real transaction data sent to the LLM)
# only turns on under the 'dev' profile - see application-dev.properties.
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web=INFO

# The app's own logs. DEBUG adds one line per categorized transaction, which
# contains real bank descriptions and amounts: local debugging only, never production.
logging.level.com.example.springaitest=${APP_LOG_LEVEL:INFO}

# Compact console lines: time, level, thread, class, message. The log file keeps
# Spring's full default format (with date) for later investigation.
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-14.14t){faint} %clr(%-28.28logger{0}){cyan} %m%n%wEx

# Persist logs to a rotating file alongside the console, so history survives
# restarts/redeploys instead of only living in whatever captured stdout.
logging.file.name=logs/spring-ai-test.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB